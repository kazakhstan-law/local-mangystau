act_code: '149700'
requisite: Решение Бейнеуского районного маслихата Мангистауской области от 2 декабря 2020 года № 56/453. Зарегистрировано Департаментом юстиции Мангистауской области 10 декабря 2020 года № 4364
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций социального обеспечения, образования, культуры, спорта, ветеринарии и здравоохранения проживающим и работающим в сельских населенных пунктах Бейнеуского района
  kaz: Бейнеу ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария және денсаулық сақтау ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін бекіту туралы
