  title:
    rus: О внесении изменения в решение Бейнеуского районного маслихата от 2 декабря 2020 года № 56/453 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций социального обеспечения, образования, культуры, спорта, ветеринарии и здравоохранения проживающим и работающим в сельских населенных пунктах Бейнеуского района»
    kaz: Бейнеу аудандық мәслихатының 2020 жылғы 2 желтоқсандағы № 56/453 «Бейнеу ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария және денсаулық сақтау ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
