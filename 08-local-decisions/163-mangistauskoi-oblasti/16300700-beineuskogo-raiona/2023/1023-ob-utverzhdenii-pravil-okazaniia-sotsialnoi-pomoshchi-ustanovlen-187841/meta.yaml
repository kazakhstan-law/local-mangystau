  title:
    rus: О внесении изменения в решение Бейнеуского районного маслихата от 23 октября 2023 года № 7/71 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Бейнеуском районе»
