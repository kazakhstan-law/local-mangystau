  title:
    rus: О внесении изменений в решение Бейнеуского районного маслихата от 23 октября 2023 года № 7/71 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Бейнеуском районе»
    kaz: «Бейнеу ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Бейнеу аудандық мәслихатының 2023 жылғы 23 қазандағы № 7/71 шешіміне өзгерістер енгізу туралы
