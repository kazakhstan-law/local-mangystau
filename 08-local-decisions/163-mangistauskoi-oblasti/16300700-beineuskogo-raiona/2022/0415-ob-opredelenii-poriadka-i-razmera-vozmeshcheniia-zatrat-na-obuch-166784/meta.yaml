  title:
    rus: О внесении изменений в решение Бейнеуского районного маслихата от 15 апреля 2022 года № 18/171 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Бейнеуском районе»
    kaz: Бейнеу аудандық мәслихатының 2022 жылғы 15 сәуірдегі № 18/171 «Бейнеу ауданындағы мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
