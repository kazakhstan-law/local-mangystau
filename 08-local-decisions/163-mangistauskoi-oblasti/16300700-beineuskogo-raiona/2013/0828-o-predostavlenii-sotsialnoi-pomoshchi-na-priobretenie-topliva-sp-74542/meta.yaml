  title:
    rus: О внесении изменений  в решение Бейнеуского районного маслихата от 28 августа 2013 года №17/113 «О назначении социальной помощи на возмещение расходов на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах»
    kaz: Бейнеу аудандық  мәслихатының 2013 жылғы 28 тамыздағы № 17/113 «Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуғ ажұмсалатын шығынды өтеу үшін әлеуметтік көмек тағайындау туралы» шешіміне өзгерістер енгізу туралы
