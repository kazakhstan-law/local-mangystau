  title:
    rus: О внесении изменения и дополнения в решение Бейнеуского  районного маслихата  от 25 ноября 2013 года   №18/120 «Об утверждении  Правил оказания  социальной  помощи, установления  размеров и определения перечня отдельных категорий нуждающихся граждан в Бейнеуском районе»
    kaz: Бейнеу аудандық мәслихатының 2013 жылғы 25 қарашадағы №18/120 «Бейнеу ауданында әлеуметтік көмек көрсетудің, оның мөлшерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидасын бекіту туралы» шешіміне өзгеріс және толықтыру енгізу туралы
