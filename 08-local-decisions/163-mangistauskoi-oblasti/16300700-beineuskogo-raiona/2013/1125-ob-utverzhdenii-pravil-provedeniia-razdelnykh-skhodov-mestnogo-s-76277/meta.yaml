  title:
    rus: О внесении изменений в решение Бейнеуского районного маслихата от 25 ноября 2013 года № 18/118 «Об утверждении Правил о порядке проведения раздельного схода местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Акжигитского сельского округа»
    kaz: Бейнеу аудандық мәслихатының 2013 жылғы 25 қарашадағы № 18/118 «Ақжігіт селолық округінің аумағында бөлек жергілікті қоғамдастық жиынын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібі туралы қағидаларды бекіту туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/113943/rus
