requisite: Решение маслихата Каракиянского района Мангистауской области от 5 июня 2014 года № 19/202. Зарегистрировано Департаментом юстиции Мангистауской области 30 июня 2014 года № 2462. Утратило силу решением Каракиянского районного маслихата Мангистауской области от 15 декабря 2014 года № 24/245
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
