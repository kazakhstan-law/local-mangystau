act_code: '111269'
requisite: Решение Каракиянского районного маслихата Мангистауской области от 10 марта 2017 года № 8/92. Зарегистрировано Департаментом юстиции Мангистауской области 14 апреля 2017 года № 3334
title:
  rus: О предоставлении в 2017 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каракиянского района
  kaz: Қарақия ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2017 жылы әлеуметтік қолдау шараларын ұсыну туралы
