  title:
    rus: О внесении изменения в решение Каракиянского районного маслихата от 11 июля 2013 года № 11/120 «Об утверждении Правил определения размера и порядка оказания жилищной помощи малообеспеченным семьям (гражданам) в Каракиянском районе»
    kaz: Қарақия аудандық мәслихатының 2013 жылғы 11 шілдедегі № 11/120 «Қарақия ауданында аз қамтамасыз етілген отбасыларға (азаматтарға) тұрғын үй көмегін көрсетудің мөлшерін және тәртібін айқындау Қағидасын бекіту туралы» шешіміне  өзгеріс енгізу туралы
