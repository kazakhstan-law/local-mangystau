requisite: Решение Каракиянского районного маслихата Мангистауской области от 3 июля 2018 года № 18/212. Зарегистрировано Департаментом юстиции Мангистауской области 18 июля 2018 года № 3690. Утратило силу решением Каракиянского районного маслихата Мангистауской области от 27 ноября 2020 года № 45/451
title:
  rus: О предоставлении социальной помощи на оплату коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елдi мекендерде тұратын және жұмыс істейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу үшін әлеуметтік көмек беру туралы
