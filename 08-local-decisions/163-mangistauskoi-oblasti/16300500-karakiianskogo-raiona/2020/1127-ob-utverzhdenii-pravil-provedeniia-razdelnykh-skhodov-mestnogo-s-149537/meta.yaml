  requisite: Решение Каракиянского районного маслихата Мангистауской области от 12 ноября 2021 года № 9/78. Утратило силу решением Каракиянского районного маслихата Мангистауской области от 6 октября 2023 года № 6/44
  title:
    rus: О внесении изменений в решение Каракиянского районного маслихата от 27 ноября 2020 года № 45/452 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Каракиянского района»
    kaz: «Қарақия ауданының елді мекендерінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» Қарақия аудандық мәслихатының 2020 жылғы 27 қарашадағы № 45/452 шешіміне өзгерістер енгізу туралы
