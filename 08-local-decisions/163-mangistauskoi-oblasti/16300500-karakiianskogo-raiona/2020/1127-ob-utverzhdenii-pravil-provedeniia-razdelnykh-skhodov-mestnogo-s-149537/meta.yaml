title:
  rus: Об утверждении правил проведения раздельных сходов местного сообществана территории сел, сельских округов Каракиянского района
  kaz: Қарақия ауданының ауыл, ауылдық округтерінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібін бекіту туралы
