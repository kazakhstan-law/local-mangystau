title:
  rus: Об утверждении проекта (схемы) зонирования земель, границы оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки сельского округа Бостан Каракиянского района
  kaz: Қарақия ауданының Боcтан ауылдық округінің жерді аймақтарға бөлу жобасы (схемасы), бағалау аумақтарының шекараларын жәнежер учаскелері үшін төлемақының базалық мөлшерлемелеріне түзету коэффициенттерін бекіту туралы
