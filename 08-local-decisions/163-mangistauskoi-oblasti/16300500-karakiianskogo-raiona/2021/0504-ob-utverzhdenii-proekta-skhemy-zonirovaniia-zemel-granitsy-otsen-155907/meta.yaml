    kaz: Қарақия аудандық мәслихатының 2021 жылғы 4 мамырдағы № 4/30 «Қарақия ауданының Боcтан ауылдық округінің жерді аймақтарға бөлу жобасы (схемасы), бағалау аумақтарының шекараларын және жер учаскелері үшін төлемақының базалық мөлшерлемелеріне түзету коэффициенттерін бекіту туралы» шешіміне өзгерістер енгізу туралы
