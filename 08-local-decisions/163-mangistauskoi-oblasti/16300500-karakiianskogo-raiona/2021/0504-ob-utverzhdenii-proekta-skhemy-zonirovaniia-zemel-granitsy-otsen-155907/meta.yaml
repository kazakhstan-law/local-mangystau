  title:
    rus: О внесении изменений в решение Каракиянского районного маслихата от 4.05.2021 года № 4/30 «Об утверждении проекта (схемы) зонирования земель, границы оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки по сельскому округу Бостан Каракиянского района»
    kaz: Қарақия аудандық мәслихатының 2021 жылғы 4 мамырдағы № 4/30 «Қарақия ауданы Боcтан ауылдық округі бойынша жерді аймақтарға бөлу жобасын (схемасын), бағалау аймақтарының шекараларын және жер учаскелері үшін төлемақының базалық мөлшерлемелеріне түзету коэффициенттерін бекіту туралы» шешіміне өзгерістер енгізу туралы
