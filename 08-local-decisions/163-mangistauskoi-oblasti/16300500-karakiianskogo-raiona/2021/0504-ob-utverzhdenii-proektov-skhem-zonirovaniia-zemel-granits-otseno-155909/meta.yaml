title:
  rus: Об утверждении проектов (схем) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки села Сенек и населенного пункта Аккудык Каракиянского района
  kaz: Қарақия ауданының Сенек ауылы және Аққұдық елді мекенінің жерді аймақтарға бөлу жобалары (схемалар), бағалау аумақтарының шекараларын және жер учаскелері үшін төлемақының базалық мөлшерлемелеріне түзету коэффициенттерін бекіту туралы
