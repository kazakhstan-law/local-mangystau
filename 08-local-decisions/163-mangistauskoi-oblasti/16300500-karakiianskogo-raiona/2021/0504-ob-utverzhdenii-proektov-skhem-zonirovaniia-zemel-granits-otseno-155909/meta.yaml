  title:
    rus: О внесении изменений в решение Каракиянского районного маслихата от 4 мая 2021 года № 4/31 «Об утверждении проектов (схем) зонирования земель, границы оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки по селу Сенек и населенному пункту Аккудык Каракиянского района»
    kaz: Қарақия аудандық мәслихатының 2021 жылғы 4 мамырдағы № 4/31 «Қарақия ауданы Сенек ауылы және Аққұдық елді мекені бойынша жерді аймақтарға бөлу жобасын (схемасын), бағалау аймақтарының шекараларын және жер учаскелері үшін төлемақының базалық мөлшерлемелеріне түзету коэффициенттерін бекіту туралы» шешіміне өзгерістер енгізу туралы
