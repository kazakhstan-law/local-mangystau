  title:
    rus: О внесении изменений в решение Каракиянского районного маслихата от 30 июня 2022 года № 16/155 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Каракиянском районе»
    kaz: Қарақия аудандық мәслихатының 2022 жылғы 30 маусымдағы № 16/155 «Қарақия ауданындағы мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алудың тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
