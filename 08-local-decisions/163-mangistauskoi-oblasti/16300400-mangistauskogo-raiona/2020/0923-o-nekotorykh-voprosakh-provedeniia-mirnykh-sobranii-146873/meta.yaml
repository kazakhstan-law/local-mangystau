  title:
    rus: О внесении изменении в решение Мангистауского районного маслихата от 23 сентября 2020 года № 41/442 «Об определении специализированного места для организации и проведения мирных собраний, порядок использования специализированного места для организации и проведения мирных собраний, норма его предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированного места для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в Мангистауском районе»
    kaz: Маңғыстау аудандық мәслихатының 2020 жылғы 23 қыркүйектегі № 41/442 «Маңғыстау ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орынды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орынды пайдалану тәртібін, оның шекті толу нормасын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орынды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/162124/rus
