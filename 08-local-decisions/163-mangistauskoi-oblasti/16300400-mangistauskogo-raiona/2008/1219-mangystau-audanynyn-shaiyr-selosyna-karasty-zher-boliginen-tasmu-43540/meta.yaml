act_code: '43540'
requisite: Маңғыстау облысы Маңғыстау аудандық мәслихатының 2008 жылғы 19 желтоқсандағы № 10/125 шешімі мен Маңғыстау ауданы әкімдігінің 2008 жылғы 12 желтоқсандағы № 242 қаулысы.Маңғыстау облысының Әділет департаменті Маңғыстау ауданының Әділет басқармасында 2009 жылғы 15 қаңтарда нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 11-5-66 болып енгізілді
