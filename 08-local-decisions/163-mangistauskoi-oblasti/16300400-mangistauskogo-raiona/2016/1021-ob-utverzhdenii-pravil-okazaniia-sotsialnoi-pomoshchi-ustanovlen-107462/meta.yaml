    kaz: Маңғыстау аудандық мәслихатының 2016 жылғы 21 қазандағы № 5/52 «Маңғыстау ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгертулер мен толықтырулар енгізу туралы
