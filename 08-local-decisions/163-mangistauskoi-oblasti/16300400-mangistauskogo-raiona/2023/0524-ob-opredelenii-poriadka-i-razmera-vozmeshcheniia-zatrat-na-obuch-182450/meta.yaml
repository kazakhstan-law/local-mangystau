    rus: О внесении изменения в решение Мангистауского районного маслихата от 24 мая 2023 года № 3/20 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Мангистауском районе»
    kaz: Маңғыстау аудандық мәслихатының 2023 жылғы 24 мамырдағы № 3/20 «Маңғыстау ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгеріс енгізу туралы
