requisite: Решение Мангистауского районного маслихата Мангистауской области от 16 апреля 2024 года № 11/82. Зарегистрировано Департаментом юстиции Мангистауской области 18 апреля 2024 года № 4697-12. Утратило силу решением Мангистауского районного маслихата Мангистауской области от 3 декабря 2024 года № 16/120.
title:
