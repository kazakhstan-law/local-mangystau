title:
  rus: Об утверждений Правил проведения раздельных сходов местного сообщества города Форт-Шевченко и сел, сельского округа Тупкараганского района
  kaz: Түпқараған ауданының Форт-Шевченко қаласы мен ауылдарының, ауылдық округтің жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын бекіту туралы
