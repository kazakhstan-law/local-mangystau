  requisite: Решение Тупкараганского районного маслихата Мангистауской области от 10 декабря 2021 года № 9/57. Утратило силу решением Тупкараганского районного маслихата Мангистауской области от 9 октября 2023 года № 6/43
  title:
    rus: О внесении изменений в решение Тупкараганского районного маслихата от 11 апреля 2014 года № 20/146 «Об утверждении Правил о порядке проведения раздельных сходов местного сообщества города Форт-Шевченко и сел Тупкараганского района и определения количества представителей жителей города, села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества»
    kaz: Түпқараған аудандық мәслихатының 2014 жылғы 11 сәуірдегі № 20/146 «Түпқараған ауданының Форт-Шевченко қаласы мен ауылдарының бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін қала, ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібі туралы қағидаларды бекіту туралы» шешіміне өзгерістер енгізу туралы
