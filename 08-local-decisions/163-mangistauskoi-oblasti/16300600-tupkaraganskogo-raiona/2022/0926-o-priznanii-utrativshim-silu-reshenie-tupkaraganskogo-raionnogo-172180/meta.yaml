title:
  rus: О признании утратившим силу решение Тупкараганского районного маслихата от 26 июня 2020 года № 45/336 «О повышении базовых ставок земельного налога на не используемые земли сельскохозяйственного назначения в Тупкараганском районе»
  kaz: Түпқараған аудандық мәслихатының 2020 жылғы 26 маусымдағы № 45/336 «Түпқараған ауданында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін жоғарлату туралы» шешімінің күшін жою туралы
