act_code: '25548'
requisite: Маңғыстау облысы Түпқараған ауданы әкімінің 2005 жылғы 26 қазандағы № 413 шешімі. Маңғыстау облысы Әділет департаменті Түпқараған ауданының әділет басқармасында 2005 жылғы 5 желтоқсандағы № 11-6-16 болып тіркелді
title:
  rus: Түпқараған ауданы білім беру ұйымдарында әскери шақырылғанға дейінгі және әскерге шақыру жасындағы оқушыларды 2005-2006 оқу жылындағы бастапқы әскери даярлығын ұйыдастыру және оны өткізу туралы.
