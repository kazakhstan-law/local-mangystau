requisite: Маңғыстау облысы Түпқараған аудандық мәслихатының 2008 жылғы 12 желтоқсандағы № 13/87 шешімі. Маңғыстау облысының Әділет департаменті Түпқараған ауданының Әділет басқармасында 2009 жылғы 24 қаңтарда нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 11-6-80 болып енгізілді. Күші жойылды - Маңғыстау облысы  Түпқараған аудандық мәслихатының 2011 жылғы 31 қазандағы № 41/244 шешімімен
