act_code: '44053'
requisite: Маңғыстау облысы Түпқараған аудандық әкімдігінің 2008 жылғы 12 желтоқсандағы № 13/86 шешімі. Маңғыстау облысының Әділет департаменті Маңғыстау облысы Түпқараған ауданының Әділет басқармасында 2009 жылғы 24 қаңтарда нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 11-6-79 болып енгізілді. Күші жойылды - Маңғыстау облысы Түпқараған аудандық мәслихатының 2012 жылғы 2 шілдедегі № 4/32 шешімімен
