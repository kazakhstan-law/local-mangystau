act_code: '44055'
requisite: Маңғыстау облысы Түпқараған аудандық мәслихатының 2008 жылғы 12 желтоқсандағы № 13/88 шешімі. Маңғыстау облысының Әділет департаменті Түпқараған ауданының Әділет басқармасында 2009 жылғы 24 қаңтарда нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 11-6-81 болып енгізілді. Күші жойылды - Маңғыстау облысы Түпқараған аудандық мәслихатының 2012 жылғы 2 шілдедегі № 4/32 шешімімен
