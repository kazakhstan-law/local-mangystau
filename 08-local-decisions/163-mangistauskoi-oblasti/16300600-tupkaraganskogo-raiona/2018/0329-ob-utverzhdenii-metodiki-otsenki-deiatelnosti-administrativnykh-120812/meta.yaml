  title:
    rus: О внесении изменения в решение Тупкараганского районного маслихата от 29 марта 2018 года № 18/148 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарата Тупкараганского районного маслихата»
