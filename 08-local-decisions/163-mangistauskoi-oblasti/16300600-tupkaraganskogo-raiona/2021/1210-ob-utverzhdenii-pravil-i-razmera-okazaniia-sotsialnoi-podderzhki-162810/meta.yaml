  title:
    rus: О внесении изменения в решение Тупкараганского районного маслихата от 10 декабря 2021 года № 9/56 «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организации здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в селах и сельских округах Тупкараганского района»
    kaz: Түпқараған аудандық мәслихатының 2021 жылғы 10 желтоқсандағы № 9/56 «Түпқараған ауданының ауылдары мен ауылдық округтерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидасы мен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
