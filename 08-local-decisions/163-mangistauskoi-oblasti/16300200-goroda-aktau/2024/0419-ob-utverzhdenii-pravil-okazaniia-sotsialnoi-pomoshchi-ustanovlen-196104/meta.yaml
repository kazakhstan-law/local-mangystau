  title:
    rus: О внесении изменений и дополнений в решение Актауского городского маслихата от 19 апреля 2024 года № 12/76 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в городе Актау»
    kaz: «Ақтау қаласында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Ақтау қалалық мәслихатының 2024 жылғы 19 сәуірдегі № 12/76 шешіміне өзгерістер мен толықтырулар енгізу туралы
