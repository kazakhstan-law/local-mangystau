requisite: Решение Актауского городского маслихата от 15 октября 2002 года № 26/240. Зарегистрировано Управлением юстиции Мангистауской области 9 января 2003 года № 1248. Утратило силу решением маслихата города Актау Мангистауской области от 12 апреля 2012 года № 2/25.
title:
  rus: О правилах застройки территории жилых массивов под строительство индивидуальными жилыми домами коттеджного и блокировочного типа в городе Актау
