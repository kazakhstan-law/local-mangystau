  title:
    rus: О внесении изменений в решение городского маслихата от 15 октября 2008 года № 13/127 "Об утверждении Инструкции по назначению и выплате по льготному проезду на городском общественном транспорте (кроме такси) обучающимся и воспитанникам организаций образования очной формы обучения города Актау"
    kaz: Қалалық мәслихаттың 2008 жылғы 15 қазандағы № 13/127 "Ақтау қаласындағы білім беру ұйымдарының күндізгі оқу нысанында оқитындар мен тәрбиеленушілер үшін қалалық қоғамдық көлікте (таксиден басқа) жеңілдікпен жүруді белгілеу және төлеуінің нұсқаулығын бекіту туралы" шешіміне өзгерістер енгізу туралы
