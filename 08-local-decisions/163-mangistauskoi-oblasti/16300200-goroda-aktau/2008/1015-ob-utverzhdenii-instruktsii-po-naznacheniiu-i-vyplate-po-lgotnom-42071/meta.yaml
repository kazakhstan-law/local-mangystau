title:
  rus: Об утверждении Инструкции по назначению и выплате по льготному проезду на городском общественном транспорте (кроме такси) обучающимся и воспитанникам организации образования очной формы обучения города Актау
  kaz: Ақтау қаласындағы білім беру ұйымдарының күндізгі оқу нысанында оқитындар мен тәрбиеленушілер үшін қалалық қоғамдық көлікте (таксиден басқа) жеңілдікпен жүруді белгілеу және төлеуінің нұсқаулығын бекіту туралы
