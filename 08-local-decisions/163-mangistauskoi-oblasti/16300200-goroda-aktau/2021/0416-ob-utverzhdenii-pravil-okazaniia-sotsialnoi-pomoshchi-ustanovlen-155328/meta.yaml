  title:
    rus: О внесении изменений в решение Актауского городского маслихата Мангистауской области от 16 апреля 2021 года № 2/18 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан, проживающих в городе Актау»
