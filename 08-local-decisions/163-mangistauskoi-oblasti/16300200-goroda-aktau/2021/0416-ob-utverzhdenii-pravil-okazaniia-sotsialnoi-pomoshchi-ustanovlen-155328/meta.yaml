  title:
    rus: О внесении изменения в решение Актауского городского маслихата Мангистауской области от 16 апреля 2021 года №2/18 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан, проживающих в городе Актау»
    kaz: Маңғыстау облысы Ақтау қалалық мәслихатының 2021 жылғы 16 сәуірдегі №2/18 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Ақтау қаласында тұратын мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
