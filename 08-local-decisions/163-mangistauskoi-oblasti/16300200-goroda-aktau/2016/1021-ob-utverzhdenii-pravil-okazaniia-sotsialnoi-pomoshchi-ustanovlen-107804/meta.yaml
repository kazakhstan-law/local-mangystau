title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан, проживающих в городе Актау
  kaz: Ақтау қаласында тұратын мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау және әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу қағидаларын бекіту туралы
