  title:
    rus: О внесении изменений и дополнений в решение городского маслихата от 21 октября 2016 года № 5/58 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Актау»
    kaz: Қалалық мәслихаттың 2016 жылғы 21 қазандағы № 5/58 "Әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және Ақтау қаласының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы" шешіміне өзгерістер мен толықтырулар енгізу туралы
