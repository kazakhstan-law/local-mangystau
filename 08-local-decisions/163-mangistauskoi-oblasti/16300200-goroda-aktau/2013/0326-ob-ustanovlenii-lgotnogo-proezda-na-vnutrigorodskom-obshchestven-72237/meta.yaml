title:
  rus: Об установлении льготного проезда на внутригородском общественном транспорте (кроме такси) для обучающихся и воспитанников организаций образования очной формы обучения города Актау
  kaz: Ақтау қаласының білім беру ұйымдарының күндізгі оқу нысанында оқитындар мен тәрбиеленушілері үшін қала ішіндегі қоғамдық көлікте (таксиден басқа) жеңілдікпен жол жүруді белгілеу туралы
