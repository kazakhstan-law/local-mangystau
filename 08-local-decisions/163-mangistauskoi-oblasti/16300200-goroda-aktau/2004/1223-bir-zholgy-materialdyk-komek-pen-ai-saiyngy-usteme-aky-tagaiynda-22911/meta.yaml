  requisite: Решение Актауского городского маслихата Мангистауской области от 30 сентября 2005 года № 19/150. Зарегистрировано Управлением юстиции города Актау Мангистауской области 14 октября 2005 года № 11-1-13. Утратило силу - решением Актауского городского маслихата Мангистауской области от 28 сентября 2006 года № 28/257
  title:
    rus: О внесении изменения в решение городского маслихата от 23 декабря 2004 года № 12/92 "Об утверждении Правил назначения и оказания единовременной материальной помощи и ежемесячной доплаты", зарегистрированное в департаменте юстиции 4 февраля 2005 года № 1849
    kaz: Әділет департаментiнде 2005 жылы 4 ақпанда № 1849 тiркелген, "Бiр жолғы материалдық көмек пен ай сайынғы үстеме ақы тағайындау мен көрсету Ережесiн бекiту туралы" қалалық мәслихаттың 2004 жылғы 23 желтоқсандағы № 12/92 шешiмiне өзгерiс енгiзу туралы
