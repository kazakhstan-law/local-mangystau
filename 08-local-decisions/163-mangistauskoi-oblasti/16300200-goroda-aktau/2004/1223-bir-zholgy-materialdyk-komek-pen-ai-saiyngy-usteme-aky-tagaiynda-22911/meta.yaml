act_code: '22911'
requisite: Маңғыстау облысы Ақтау қалалық мәслихатының 2004 жылғы 23 желтоқсандағы № 12/92 шешімі. Маңғыстау облыстық Әділет Департаментінде 2005 жылғы 4 ақпанда № 1849 тіркелді. Күші жойылды - Ақтау қалалық мәслихатының 2009 жылғы 20 шілдедегі № 21/203 шешімімен.
