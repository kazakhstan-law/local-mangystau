  title:
    rus: О внесении изменений в решение городского маслихата от 27 апреля 2011 года № 42/385 «Об установлении единых ставок фиксированного налога для всех налогоплательщиков, осуществляющих деятельность в городе Актау»
    kaz: Қалалық мәслихаттың 2011 жылғы 27 сәуірдегі № 42/385 «Қызметін Ақтау қаласында жүзеге асыратын барлық салық төлеушілер үшін бірыңғай тіркелген салық ставкасын белгілеу туралы» шешіміне өзгерістер енгізу туралы
