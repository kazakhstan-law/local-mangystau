title:
  rus: Об установлении единых ставок фиксированного налога для всех налогоплательщиков, осуществляющих деятельность в городе Актау
  kaz: Ақтау қаласында қызметін жүзеге асыратын барлық салық төлеушілер үшін тіркелген салықтың бірыңғай мөлшерлемелерін белгілеу туралы
