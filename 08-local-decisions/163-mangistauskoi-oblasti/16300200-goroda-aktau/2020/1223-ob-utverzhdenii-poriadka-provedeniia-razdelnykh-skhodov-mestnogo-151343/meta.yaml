requisite: Решение Актауского городского маслихата Мангистауской области от 23 декабря 2020 года № 38/425. Зарегистрировано Департаментом юстиции Мангистауской области 6 января 2021 года № 4412. Утратило силу решением Актауского городского маслихата Мангистауской области от 6 декабря 2023 года № 8/46
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества села Умирзак города Актау
  kaz: Ақтау қаласы Өмірзақ ауылының жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл, шағын аудан, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
