requisite: Решение Актауского городского маслихата Мангистауской области от 28 сентября 2006 года № 28/252. Зарегистрировано Департаментом юстиции Мангистауской области от 26 октября 2015 года № 11-1-41. Утратило силу решением Актауского городского маслихата Мангистауской области от 12 апреля 2012 года № 2/26
title:
  rus: О назначении и выплате социальной помощи на приобретение топлива (уголь) специалистам государственных организаций здравоохранения, образования и спорта, социальной защиты населения и культуры, проживающим и работающим в  сельской местности
  kaz: Ауылдық жерлерде тұратын және жұмыс жасайтын денсаулық сақтау, білім беру және спорт,  халықты әлеуметтік қорғау және мәдениет мемлекеттік мекемелердің мамандарына отын (көмір) алуға әлеуметтік көмек тағайындау және төлеу туралы
