act_code: '160532'
requisite: Решение Мунайлинского районного маслихата Мангистауской области от 3 ноября 2021 года № 11/65. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 ноября 2021 года № 25224
title:
  rus: Об утверждении Правил оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Мунайлинского района
  kaz: Мұнайлы ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидасын бекіту туралы
