  title:
    rus: О внесении изменений в решение Мунайлинского районного маслихата от 3 ноября 2021 года № 11/65 «Об утверждении Правил оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Мунайлинского района»
    kaz: Мұнайлы аудандық мәслихатының 2021 жылғы 3 қарашадағы № 11/65 «Мұнайлы ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
