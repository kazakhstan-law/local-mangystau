act_code: '155428'
requisite: Решение Мунайлинского районного маслихата Мангистауской области от 16 апреля 2021 года № 3/19. Зарегистрировано Департаментом юстиции Мангистауской области 27 апреля 2021 года № 4505
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Мунайлинского района на 2021 год
  kaz: 2021 жылға арналған Мұнайлы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы
