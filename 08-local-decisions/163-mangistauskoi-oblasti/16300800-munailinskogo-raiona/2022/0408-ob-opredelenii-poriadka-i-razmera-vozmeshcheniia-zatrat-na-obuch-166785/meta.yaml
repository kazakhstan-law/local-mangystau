    kaz: Мұнайлы аудандық мәслихатының 2022 жылғы 8 сәуірдегі № 18/110 «Мұнайлы ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
