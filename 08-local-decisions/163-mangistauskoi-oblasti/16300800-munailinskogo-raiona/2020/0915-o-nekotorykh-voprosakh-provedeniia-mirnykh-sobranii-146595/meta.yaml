  title:
    rus: О внесении изменения в решение Мунайлинского районного маслихата Мангистауской области от 15 сентября 2020 года № 57/518 «Об определении специализированного места для организации и проведения мирных собраний, порядок использования специализированного места для организации и проведения мирных собраний, норма его предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированного места для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в Мунайлинском районе»
    kaz: Маңғыстау облысы Мұнайлы аудандық мәслихатының 2020 жылғы 15 қыркүйектегі № 57/518 «Мұнайлы ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орынды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орынды пайдалану тәртібін, оның шекті толу нормасын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орынды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/161832/rus
