act_code: '147564'
requisite: Решение Мунайлинского районного маслихата Мангистауской области от 8 октября 2020 года № 58/523. Зарегистрировано Департаментом юстиции Мангистауской области 19 октября 2020 года № 4321. Утратило силу решением Мунайлинского районного маслихата Мангистауской области от 3 ноября 2021 года № 11/65
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций социального обеспечения, образования, культуры, спорта, ветеринарии и здравоохранения проживающим и работающим в сельских населенных пунктах Мунайлинского района
  kaz: Мұнайлы ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария және денсаулық сақтау ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін бекіту туралы
