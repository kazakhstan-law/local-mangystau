  title:
    rus: О внесении изменений в решение Мунайлинского районного маслихата от 23 октября 2023 года № 6/41 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Мунайлинском районе»
    kaz: «Мұнайлы ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Мұнайлы аудандық мәслихатының 2023 жылғы 23 қазандағы № 6/41 шешіміне өзгерістер енгізу туралы
