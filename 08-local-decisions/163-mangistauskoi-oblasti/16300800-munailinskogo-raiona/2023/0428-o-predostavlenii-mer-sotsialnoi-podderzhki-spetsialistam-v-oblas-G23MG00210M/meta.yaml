  title:
    rus: О внесении изменений в решение Мунайлинского районного маслихата от 28 мая 2023 года № 2/10 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Мунайлинского района»
    kaz: Мұнайлы аудандық мәслихатының 2023 жылғы 28 мамырдағы № 2/10 «Мұнайлы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
