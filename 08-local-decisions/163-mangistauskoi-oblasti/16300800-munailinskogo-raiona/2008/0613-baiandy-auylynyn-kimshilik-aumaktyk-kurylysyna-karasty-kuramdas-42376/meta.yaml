act_code: '42376'
requisite: Маңғыстау облысы Мұнайлы ауданы әкімдігі Баянды селосы әкімінің 2008 жылғы 13 маусымдағы № 24 шешімі. Маңғыстау облысы Мұнайлы ауданының Әділет басқармасында 2008 жылғы 30 маусымда № 11-7-7 болып тіркелді
