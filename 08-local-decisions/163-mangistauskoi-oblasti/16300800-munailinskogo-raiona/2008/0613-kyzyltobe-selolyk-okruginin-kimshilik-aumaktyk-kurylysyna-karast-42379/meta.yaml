act_code: '42379'
requisite: Маңғыстау облысы Мұнайлы ауданы Қызылтөбе селолық округі әкімінің 2008 жылғы 13 маусымдағы № 232-А шешімі. Маңғыстау облысы Әділет департаментінде 2008 жылғы 30 маусымда № 11-7-10 болып тіркелді. Күші жойылды-Маңғыстау облысы Мұнайлы ауданы Қызылтөбе ауылдық округі әкімінің 2017 жылғы 25 қаңтардағы № 13 шешімімен
