    kaz: Мұнайлы аудандық мәслихатының 2015 жылғы 3 шілдедегі № 33/347 «Мұнайлы ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидасын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
