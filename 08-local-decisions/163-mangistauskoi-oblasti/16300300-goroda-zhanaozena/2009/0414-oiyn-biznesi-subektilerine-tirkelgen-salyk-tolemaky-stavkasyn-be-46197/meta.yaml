requisite: Жаңаөзен қаласы мәслихатының 2009 жылғы 14 сәуірдегі № 16/112 шешімі. Жаңаөзен қаласының Әділет басқармасында 2009 жылғы 25 мамырда № 11-2-109 тіркелді.Күші жойылды - Маңғыстау облысы Жаңаөзен қалалық мәслихатының 2016 жылғы 16 мамырдағы № 2/23 шешімімен.
