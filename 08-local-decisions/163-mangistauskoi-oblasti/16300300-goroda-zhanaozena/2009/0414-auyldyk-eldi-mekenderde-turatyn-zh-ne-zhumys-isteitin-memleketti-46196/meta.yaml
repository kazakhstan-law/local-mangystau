requisite: Маңғыстау облысы Жаңаөзен қаласы мәслихатының 2009 жылғы 14 сәуірдегі № 16/111 шешімі. Маңғыстау облысы Әділет департаментінде Жаңаөзен қаласының Әділет басқармасында 2009 жылғы 25 мамырда № 11-2-108 тіркелді. Күші жойылды - Маңғыстау облысы Жаңаөзен қаласы мәслихатының 2012 жылғы 11 желтоқсандағы № 11/105 шешімімен
title:
