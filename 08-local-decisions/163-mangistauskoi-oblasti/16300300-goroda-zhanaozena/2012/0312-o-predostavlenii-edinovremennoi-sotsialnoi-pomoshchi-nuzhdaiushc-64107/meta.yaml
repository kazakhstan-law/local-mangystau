act_code: '64107'
requisite: Решение Жанаозенского городского маслихата Мангистауской области от 12 марта 2012 года № 3/16. Зарегистрировано Департаментом юстиции Мангистауской области 19 марта 2012 года № 11-2-187. Утратило силу решением Жанаозенского городского маслихата от 28 февраля 2013 года № 13/122
title:
  rus: О предоставлении единовременной социальной помощи нуждающимся гражданам которым причинен вред здоровью, семьям погибших в результате обстоятельств послуживших основанием для введения чрезвычайного положения в городе Жанаозен
  kaz: Жаңаөзен қаласында төтенше жағдайды енгізуге негіз болған мән-жайлардың салдарынан қаза тапқандардың отбасыларына, денсаулығы зақымданған мұқтаж азаматтарға біржолғы әлеуметтік көмек беру туралы
