  title:
    rus: О внесении изменения в решение Жанаозенского городского маслихата от 25 июня 2020 года № 46/515 «Об определении специализированного места для организации и проведения мирных собраний, порядок использования специализированного места для организации и проведения мирных собраний, норма его предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированного места для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в городе Жанаозен»
    kaz: Жаңаөзен қалалық мәслихатының 2020 жылғы 25 маусымдағы № 46/515 «Жаңаөзен қаласында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орынды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орынды пайдалану тәртібін, оның шекті толу нормасын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орынды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/145974/rus
