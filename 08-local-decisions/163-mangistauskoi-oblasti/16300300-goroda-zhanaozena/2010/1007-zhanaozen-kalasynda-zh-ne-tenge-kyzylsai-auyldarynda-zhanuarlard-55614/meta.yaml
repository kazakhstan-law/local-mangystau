requisite: Маңғыстау облысы Жаңаөзен қалалық мәслихатының 2010 жылғы 7 қазандағы № 31/236 шешімі. Маңғыстау облысы Әділет департаментінде  Жаңаөзен қаласының Әділет басқармасында 2010 жылғы 21 қарашада № 11-2-146 тіркелді. Күші жойылды - Маңғыстау облысы Жаңаөзен қалалық мәслихатының 2012 жылғы 25 шілдедегі № 7/68 шешімімен
