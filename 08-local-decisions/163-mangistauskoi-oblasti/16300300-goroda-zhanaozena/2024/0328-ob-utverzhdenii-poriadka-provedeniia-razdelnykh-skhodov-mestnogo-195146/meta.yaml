act_code: '195146'
requisite: Решение Жанаозенского городского маслихата Мангистауской области от 28 марта 2024 года № 14/115
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества в селах Тенге, Кызылсай, Рахат и Кендерли города Жанаозен Мангистауской области и определения количества представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества
  kaz: Маңғыстау облысы Жаңаөзен қаласының Теңге, Қызылсай, Рахат және Кендірлі ауылдарында жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл, шағын аудан, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
