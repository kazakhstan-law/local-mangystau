  title:
    rus: О внесении изменений и дополнений в решение Жанаозенского городского маслихата от 28 марта 2024 года № 14/111 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в городе Жанаозен»
    kaz: «Жаңаөзен қаласында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Жаңаөзен қалалық мәслихатының 2024 жылғы 28 наурыздағы № 14/111 шешіміне өзгерістер мен толықтырулар енгізу туралы
