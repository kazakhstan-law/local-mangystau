requisite: Маңғыстау облысы Жаңаөзен қалалық мәслихатының 2007 жылғы 17 қарашадағы № 3/17 шешімі. Маңғыстау облысы Әділет департаменті Жаңаөзен қаласының әділет басқармасында 2007 жылғы 28 желтоқсанда № 11-2-67 болып тіркелді. Күші жойылды-Маңғыстау облысы Жаңаөзен қалалық мәслихатының 2016 жылғы 12 қазандағы № 6/64 шешімімен
