  title:
    rus: О внесении изменений в решение Жанаозенского городского маслихата от 16 мая 2014 года № 28/233 «Об утверждении Правил о порядке  проведения раздельных сходов местного  сообщества сел Тенге, Кызылсай и Рахат города Жанаозен Мангистауской области и определения количества представителей жителей села для участия в сходе местного сообщества»
    kaz: Жаңаөзен қалалық мәслихатының 2014 жылғы 16 мамырдағы № 28/233 «Маңғыстау облысы Жаңаөзен қаласының Тенге, Қызылсай және Рахат ауылдарында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
