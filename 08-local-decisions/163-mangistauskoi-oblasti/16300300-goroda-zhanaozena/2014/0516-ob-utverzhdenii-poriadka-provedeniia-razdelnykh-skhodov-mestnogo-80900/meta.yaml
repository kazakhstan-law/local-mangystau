act_code: '80900'
requisite: Решение маслихата города Жанаозен Мангистауской области от 16 мая 2014 года № 28/233. Зарегистрировано Департаментом юстиции Мангистауской области 18 июня 2014 года № 2450. Утратило силу решением Жанаозенского городского  маслихата Мангистауской области от 6 декабря 2023 года № 9/84
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества сел Тенге, Кызылсай, Рахат и Кендерли города  Жанаозен Мангистауской области и определения количества представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества
  kaz: Маңғыстау облысы Жаңаөзен қаласының Теңге, Қызылсай, Рахат және Кендірлі ауылдарының жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл, шағын аудан, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы
