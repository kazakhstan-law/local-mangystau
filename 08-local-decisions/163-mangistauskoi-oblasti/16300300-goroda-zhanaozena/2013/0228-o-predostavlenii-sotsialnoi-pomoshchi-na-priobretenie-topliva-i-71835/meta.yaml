act_code: '71835'
requisite: Решение Жанаозенского городского маслихата от 28 февраля 2013 года № 13/120. Зарегистрировано Департаментом юстиции Мангистауской области 04 апреля 2013 года за № 2236. Утратило силу решением Жанаозенского городского маслихата Мангистауской области от 16 апреля 2021 года № 3/28
title:
  rus: О предоставлении социальной помощи на приобретение топлива и оплату коммунальных услуг за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу үшін әлеуметтік көмек беру туралы
