  title:
    rus: О внесении изменений в решение Жанаозенского городского маслихата от 28 февраля 2013 года №13/120 «О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах»
    kaz: Жаңаөзен қалалық мәслихатының 2013 жылғы 28 ақпандағы №13/120 «Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы» шешіміне өзгерістер енгізу туралы
