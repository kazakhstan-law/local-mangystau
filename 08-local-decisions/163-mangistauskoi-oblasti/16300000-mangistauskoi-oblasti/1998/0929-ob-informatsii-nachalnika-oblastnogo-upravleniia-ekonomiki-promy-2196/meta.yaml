title:
  rus: Об информации начальника областного управления экономики, промышленности и торговли Качакова А.К. "О подготовке объектов жилищно-коммунального хозяйства и топливно-энергетического комплекса области к работе в зимних условиях"
  kaz: '"Облыстың тұрғын-үй коммуналдық объектiлерi мен отын-энергетикалық комплексiнiң қысқы жағдайда жұмыс жасауға әзiрлiгi туралы" облыстық экономика, өнеркәсiп және сауда басқармасының бастығы А.Қ. Қашақовтың ақпараты туралы'
