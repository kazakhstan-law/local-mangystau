  title:
    rus: О внесении изменений в решение Мангистауского областного маслихата от 28 февраля 2018 года № 16/200 «Об утверждении Правил содержания и защиты зеленых насаждений Мангистауской области, Правил благоустройства территорий городов и населенных пунктов Мангистауской области»
    kaz: Маңғыстау облыстық мәслихаттың 2018 жылғы 28 ақпандағы № 16/200 «Маңғыстау облысының жасыл екпелерді күтіп-ұстау және қорғау қағидалары, Маңғыстау облысының қалалары мен елді мекендерінің аумақтарын абаттандыру қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
