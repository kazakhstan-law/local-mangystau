  title:
    rus: О внесении изменения в решение Мангистауского областного маслихата от 29 марта 2022 года № 9/109 «О предоставлении бесплатного проезда гражданам Республики Казахстан, проживающим в Мангистауской области за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования»
    kaz: Маңғыстау облыстық мәслихатының 2022 жылғы 29 наурыздағы № 9/109 «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Маңғыстау облысында тұратын Қазақстан Республикасының азаматтарына тұрақты тұратын елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы» шешіміне өзгеріс енгізу туралы
