act_code: '166368'
requisite: Решение Мангистауского областного маслихата от 29 марта 2022 года № 9/109. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 апреля 2022 года № 27529
title:
  rus: О предоставлении бесплатного проезда гражданам Республики Казахстан, проживающим в Мангистауской области за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Маңғыстау облысында тұратын Қазақстан Республикасының азаматтарына тұрақты тұратын елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы
