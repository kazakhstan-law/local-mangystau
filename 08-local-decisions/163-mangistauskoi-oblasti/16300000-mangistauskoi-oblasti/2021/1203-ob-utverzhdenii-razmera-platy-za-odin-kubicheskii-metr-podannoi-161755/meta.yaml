  title:
    rus: О внесении изменений в решение Мангистауского областного маслихата от 3 декабря 2021 года № 8/82 «Об утверждении размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения по Мангистауской области»
    kaz: Маңғыстау облыстық мәслихатының 2021 жылғы 3 желтоқсандағы № 8/82 «Маңғыстау облысы бойынша ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілетін ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы» шешіміне өзгерістер енгізу туралы
