  title:
    rus: О внесении изменений в решение Мангистауского областного маслихата от 27 февраля 2015 года № 22/350 «О дополнительном бесплатном предоставлении лекарственных средств инвалидам и участникам Великой Отечественной войны и лицам, приравненным к ним при амбулаторном лечении»
    kaz: Маңғыстау облыстық мәслихатының 2015 жылғы 27 ақпандағы № 22/350 «Ұлы Отан соғысының қатысушылары мен мүгедектеріне және соларға теңестірілген тұлғаларға амбулаториялық емделу кезінде дәрілік заттарды қосымша тегін беру туралы» шешіміне өзгерістер енгізу туралы
