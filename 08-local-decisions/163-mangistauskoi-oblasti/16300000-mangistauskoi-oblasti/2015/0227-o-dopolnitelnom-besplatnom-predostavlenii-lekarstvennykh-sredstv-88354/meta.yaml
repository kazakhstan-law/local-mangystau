title:
  rus: О дополнительном бесплатном предоставлении лекарственных средств при амбулаторном лечении участникам Великой Отечественной войны, лицам с инвалидностью и лицам, приравненным к ним
  kaz: Ұлы Отан соғысының қатысушыларына, мүгедектігі бар адамдарға және соларға теңестірілген тұлғаларға амбулаториялық емделу кезінде дәрілік заттарды қосымша тегін беру туралы
