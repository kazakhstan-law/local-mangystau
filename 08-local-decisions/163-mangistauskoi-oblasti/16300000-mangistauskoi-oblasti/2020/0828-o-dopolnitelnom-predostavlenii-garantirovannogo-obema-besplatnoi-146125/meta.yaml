  requisite: Решение Мангистауского областного маслихата от 11 июня 2025 года № 20/238
  title:
    rus: О внесении изменения в решение Мангистауского областного маслихата от 28 августа 2020 года № 37/446 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан постоянно проживающих на территории Мангистауской области при амбулаторном лечении бесплатно»
    kaz: «Маңғыстау облысының аумағында тұрақты тұратын Қазақстан Республикасы азаматтарының жекелеген санаттарына тегін амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, бейімделген емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы» Маңғыстау облыстық мәслихатының 2020 жылғы 28 тамыздағы № 37/446 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/211372/rus
