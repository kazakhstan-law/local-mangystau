  title:
    rus: О внесении изменений в решение Мангистауского областного маслихата от 28 августа 2020 года № 37/446 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан при амбулаторном лечении бесплатно и (или) на льготных условиях»
    kaz: Маңғыстау облыстық мәслихатының 2020 жылғы 28 тамыздағы № 37/446 «Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін және (немесе) жеңілдікті шарттармен тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/166155/rus
