  requisite: Решение Мангистауского областного маслихата от 16 февраля 2026 года № 25/295
  title:
    rus: О внесении изменений в решение Мангистауского областного маслихата от 28 августа 2020 года № 37/446 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан, постоянно проживающих на территории Мангистауской области при амбулаторном лечении бесплатно»
    kaz: «Маңғыстау облысының аумағында тұрақты тұратын Қазақстан Республикасы азаматтарының жекелеген санаттарына тегін амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, бейімделген емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы» Маңғыстау облыстық мәслихатының 2020 жылғы 28 тамыздағы № 37/446 шешіміне өзгерістер енгізу туралы
