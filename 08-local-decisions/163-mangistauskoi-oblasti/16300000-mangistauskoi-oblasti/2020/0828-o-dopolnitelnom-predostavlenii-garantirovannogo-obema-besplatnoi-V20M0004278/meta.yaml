title:
  rus: О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан постоянно проживающих на территории Мангистауской области при амбулаторном лечении бесплатно
  kaz: Маңғыстау облысының аумағында тұрақты тұратын Қазақстан Республикасы азаматтарының жекелеген санаттарына тегін амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, бейімделген емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы
