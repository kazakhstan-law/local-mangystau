title:
  rus: Об определении порядка и размера оказания социальной поддержки медицинским и фармацевтическим работникам, направленным для работы в сельские местности и поселки, города районного и областного значения Мангистауской области
  kaz: Маңғыстау облысының ауылдық жерлеріне және кенттеріне, аудандық және облыстық маңызы бар қалаларына жұмыс істеу үшін жіберілген медицина және фармацевтика қызметкерлеріне әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін айқындау туралы
