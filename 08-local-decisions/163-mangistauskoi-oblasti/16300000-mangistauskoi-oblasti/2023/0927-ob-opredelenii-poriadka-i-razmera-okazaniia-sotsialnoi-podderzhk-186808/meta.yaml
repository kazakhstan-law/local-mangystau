  title:
    rus: О внесении изменения в решение Мангистауского областного маслихата от 27 сентября 2023 года № 5/46 «Об определении порядка и размера оказания социальной поддержки медицинским и фармацевтическим работникам, направленным для работы в сельские местности и поселки, города районного и областного значения Мангистауской области»
    kaz: Маңғыстау облыстық мәслихатының 2023 жылғы 27 қыркүйектегі № 5/46 «Маңғыстау облысының ауылдық жерлеріне және кенттеріне, аудандық және облыстық маңызы бар қалаларына жұмыс істеу үшін жіберілген медицина және фармацевтика қызметкерлеріне әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін айқындау туралы» шешіміне өзгеріс енгізу туралы
