act_code: '19116'
requisite: Решение акима города Мангистауской области от 15 марта 2004 года № 24. Зарегистрировано Департаментом юстиции Мангистауской области 24 марта 2004 года № 1646. Утратило силу по истечению срока действия - письмом руководителя аппарата акима  Мангистауской области от 25 июня 2008 года № 08-12-985
title:
  rus: О проведении смотра готовности объектов водоснабжения, канализации, торговли, общественного питания и пищевой промышленности, рынков к работе в весенне-летний период и по санитарной очистке и благоустройству населенных мест Мангистауской области
  kaz: Сумен жабдықтау, канализация, сауда, қоғамдық тамақтандыру және тамақ өнеркәсібі объектілерінің, базарлардың көктемгі-жазғы кезеңдегі жұмысына әзірлігі мен Маңғыстау облысының елді мекендерінің санитарлық тазартылуы мен аббатандырылуы бойынша байқау өткізу туралы
